[build-system]
requires = ["hatchling>=1.24"]
build-backend = "hatchling.build"

[project]
name = "data-validator"
dynamic = ["version"]
description = "Strict, declarative data warehouse schema and runtime row validation."
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["pydantic>=2.7,<3"]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.6", "mypy>=1.11"]

[tool.hatch.version]
path = "src/data_validator/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/data_validator"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "UP", "SIM", "RUF", "PT", "TCH"]

[tool.ruff.lint.flake8-type-checking]
# Pydantic resolves field annotations at runtime, so their imports must stay real.
runtime-evaluated-base-classes = [
    "pydantic.BaseModel",
    "data_validator.columns.model.ColumnMeta",
    "data_validator.tables.model.TableMeta",
]

[tool.mypy]
strict = true
plugins = ["pydantic.mypy"]
files = ["src", "tests"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
markers = [
    "unit: fast tests of a single module",
    "integration: end-to-end schema and row validation",
]
